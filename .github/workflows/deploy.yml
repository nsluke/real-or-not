name: Build deck and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'      # pull new posts from the subreddit twice an hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a scheduled refresh finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.creds.outputs.configured }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Missing credentials is a "not set up yet" state, not a breakage. Skipping keeps a
      # scheduled run from failing every 30 minutes and mailing about it; anything that
      # goes wrong *after* this point is a real failure and still fails the run.
      - name: Check Reddit credentials
        id: creds
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        run: |
          if [ -n "$REDDIT_CLIENT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET are not set, so"\
                 "there is no deck to build. See SETUP.md, then re-run this workflow."
          fi

      - name: Build the deck
        if: steps.creds.outputs.configured == 'true'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
          SUBREDDIT: ${{ vars.SUBREDDIT || 'RealOrNotTCG' }}
        run: node scripts/fetch-posts.mjs

      - name: Warn if Firebase is still a placeholder
        if: steps.creds.outputs.configured == 'true'
        run: |
          if grep -q "YOUR_PROJECT_ID" site/firebase-config.js; then
            echo "::warning::site/firebase-config.js still has placeholder values — the site will"\
                 "deploy but voting stays disabled until the Firebase web config is filled in."
          fi

      - uses: actions/configure-pages@v6
        if: steps.creds.outputs.configured == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.creds.outputs.configured == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
