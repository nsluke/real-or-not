name: Build deck and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'      # pull new posts from the subreddit twice an hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a scheduled refresh finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check Reddit credentials
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        run: |
          if [ -z "$REDDIT_CLIENT_ID" ]; then
            echo "::error::REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET are not set. Reddit blocks"\
                 "unauthenticated requests from GitHub's IP ranges, so the build would fail."\
                 "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Build the deck
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
          SUBREDDIT: ${{ vars.SUBREDDIT || 'RealOrNotTCG' }}
        run: node scripts/fetch-posts.mjs

      - name: Warn if Firebase is still a placeholder
        run: |
          if grep -q "YOUR_PROJECT_ID" site/firebase-config.js; then
            echo "::warning::site/firebase-config.js still has placeholder values — the site will"\
                 "deploy but voting stays disabled until the Firebase web config is filled in."
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
